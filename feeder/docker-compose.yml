# ESPN/nbaapi.com sync (current season every 4 hours, SYNC_CRON) into the SQL Server 2005 database used by the IIS version (../iis-sql2005).
services:
  nbahub-feeder:
    build: .
    image: nbahub-feeder:1.0
    container_name: nbahub-feeder
    restart: unless-stopped
    env_file: .env
    environment:
      DB_USER: nbahub_feeder
      # Season to sync defaults to the current NBA season (end-year). Override with NBA_SEASONS="2027,2026" to sync several.
      # NBA_SEASONS: "2027"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
