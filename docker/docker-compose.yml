services:
  # 1. DATABASE: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nbahub_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: roster_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Runs on first startup
      - db_data:/var/lib/postgresql/data

  # 2. BACKEND: Node.js API
  backend:
    build: ./backend
    container_name: nbahub_api
    restart: always
    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: roster_db
    ports:
      - "3000:3000"

  # 3. FRONTEND: Nginx
  frontend:
    build: ./frontend
    container_name: nbahub_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: